{{define "head"}}
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>skysb</title>
<script src="/static/htmx.min.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#252a34;--fg:#dfe3ea;--dim:#8b94a5;
      --accent:#4a9eff;--ok:#3ecf8e;--warn:#f0a020;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
header{display:flex;align-items:center;gap:1.5rem;padding:0 1.5rem;height:52px;
       background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;letter-spacing:.5px}
header nav{display:flex;gap:1.25rem;flex:1}
header nav a{color:var(--dim);padding:2px 0;border-bottom:2px solid transparent}
header nav a.on{color:var(--fg);border-bottom-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:1.5rem}
h1{font-size:1.1rem;margin:0 0 1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:1rem;margin-bottom:1.25rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);
      vertical-align:middle}
th{color:var(--dim);font-weight:500;font-size:.8rem;text-transform:uppercase;
   letter-spacing:.4px}
tr:last-child td{border-bottom:none}
td.num{text-align:right;font-variant-numeric:tabular-nums}
form.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:.25rem;font-size:.8rem;color:var(--dim)}
input,select{background:#0c0e12;color:var(--fg);border:1px solid var(--line);
             border-radius:6px;padding:.45rem .55rem;font:inherit;min-width:9rem}
input:focus,select:focus{outline:none;border-color:var(--accent)}
button{background:var(--accent);color:#08131f;border:0;border-radius:6px;
       padding:.5rem .9rem;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
             font-weight:400;padding:.3rem .55rem}
button.ghost:hover{color:var(--fg);border-color:var(--dim)}
button.danger:hover{color:var(--bad);border-color:var(--bad)}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.75rem}
.pill.ok{background:rgba(62,207,142,.15);color:var(--ok)}
.pill.off{background:rgba(139,148,165,.15);color:var(--dim)}
.pill.bad{background:rgba(229,72,77,.15);color:var(--bad)}
.pill.live{background:rgba(96,165,250,.18);color:#60a5fa;margin-left:.25rem}
.dim{color:var(--dim)}
.stats{display:flex;gap:1rem;flex-wrap:wrap}
.stat{flex:1;min-width:9rem}
.stat .n{font-size:1.6rem;font-weight:600}
.stat .k{color:var(--dim);font-size:.8rem}
.banner{padding:.6rem .8rem;border-radius:6px;margin-bottom:1rem;
        background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.35);color:#ffb4b6}
.token{background:rgba(240,160,32,.1);border:1px solid rgba(240,160,32,.35);
       color:#ffd591;padding:.7rem .8rem;border-radius:6px;margin-bottom:1rem}
.token code{display:block;margin-top:.4rem;word-break:break-all;color:#fff;
            font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.center{max-width:22rem;margin:5rem auto}
.center label{margin-bottom:.7rem}
.center input{width:100%}
.center button{width:100%}
code.mono{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
</style>
</head>
<body>
{{end}}

{{define "nav"}}
<header>
  <span class="brand">skysb</span>
  <nav>
    <a href="/"      class="{{if eq .Page "dashboard"}}on{{end}}">概览</a>
    <a href="/users" class="{{if eq .Page "users"}}on{{end}}">用户</a>
    <a href="/nodes" class="{{if eq .Page "nodes"}}on{{end}}">节点</a>
  </nav>
  <form hx-post="/logout"><button class="ghost">退出</button></form>
</header>
{{end}}

{{define "foot"}}
<div id="err"></div>
<script>
// htmx does not swap non-2xx responses by default. Errors from the server are
// rendered as a banner, so route them into the page instead of discarding them.
document.body.addEventListener('htmx:responseError', function (e) {
  document.getElementById('err').innerHTML = e.detail.xhr.responseText;
  window.scrollTo(0, 0);
});
document.body.addEventListener('htmx:beforeSwap', function (e) {
  if (e.detail.xhr.status >= 400) { e.detail.shouldSwap = false; }
});
</script>
</body>
</html>
{{end}}

{{define "error-banner"}}<div class="banner">{{.}}</div>{{end}}
